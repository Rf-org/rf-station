server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets + .riv: cache hard.
  location ~* \.(js|css|riv|wav|png)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Never cache the service worker or the app shell.
  location = /sw.js {
    expires -1;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # SPA fallback.
  location / {
    try_files $uri /index.html;
  }
}
